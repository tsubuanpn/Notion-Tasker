name: Android quality

on:
  pull_request:
  push:
    branches: [main, codex/new-ui]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check formatting-sensitive diff
        run: git diff --check HEAD^ HEAD
      - name: Run unit tests, lint, and debug assembly
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug
      - name: Keep display branding canonical
        run: |
          ! rg -n 'Text\("NotionTasker"|append\(".*NotionTasker' app/src/main/java
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
